name = "stremio-treehouse-of-horror"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Plain (non-secret) config. TRAKT_USER, TRAKT_LIST and LIST_NAME are required:
# the Worker has no built-in defaults and returns an error if any is missing.
# TRAKT_CLIENT_ID is stored as a Worker secret, so it is deliberately NOT listed here.
[vars]
TRAKT_USER = "juicyj92"
TRAKT_LIST = "simpsons-halloween"
LIST_NAME = "Simpsons Halloween"
CACHE_DAYS = "7"

# Weekly cache. KV namespace "stremio-treehouse-of-horror-CACHE".
# To use your own, create one with: npx wrangler kv namespace create CACHE
[[kv_namespaces]]
binding = "CACHE"
id = "41371c91cc5d457abbb64a0e499c811f"
