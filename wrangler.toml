name = "stremio-treehouse-of-horror"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Plain (non-secret) config. TRAKT_USER, TRAKT_LIST and LIST_NAME are required:
# the Worker has no built-in defaults and returns an error if any is missing.
# TRAKT_CLIENT_ID is stored as a Worker secret, so it is deliberately NOT listed here.
[vars]
TRAKT_USER = "juicyj92"
TRAKT_LIST = "simpsons-halloween"
LIST_NAME = "Treehouse of Horror Collection"
# Optional summary shown on the tile's page and the addon. Unset: a generic line.
LIST_DESCRIPTION = "A binge-ready collection of The Simpsons' Halloween episodes, from the very first Treehouse of Horror to the latest, in watch order. Pick an episode and let autoplay carry you through the scares."
CACHE_DAYS = "7"
# Optional tile artwork (full https URLs). Leave unset to use the show's
# Metahub poster and background.
# POSTER_URL = "https://example.com/poster.jpg"
# BACKGROUND_URL = "https://example.com/background.jpg"

# Weekly cache. KV namespace "stremio-treehouse-of-horror-CACHE".
# To use your own, create one with: npx wrangler kv namespace create CACHE
[[kv_namespaces]]
binding = "CACHE"
id = "41371c91cc5d457abbb64a0e499c811f"
